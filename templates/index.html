<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>音乐 AI 伴侣</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0a0a0f;
  color: #e0e0e0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 顶部栏 */
.header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #2a2a3a;
  flex-shrink: 0;
}
.avatar {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, #e84393, #6c5ce7);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.char-info { flex:1; min-width:0; }
.char-name { font-size: 16px; font-weight: 600; }
.char-type { font-size: 12px; color: #888; margin-top: 2px; }
.header-btns { display:flex; gap:8px; }
.header-btns button {
  background: #2a2a3a; color: #ccc; border: none;
  padding: 6px 12px; border-radius: 16px; font-size: 13px;
  cursor: pointer; white-space: nowrap;
}
.header-btns button.active { background: #6c5ce7; color: #fff; }

/* 聊天区 */
.chat-area {
  flex:1; overflow-y:auto; padding:16px;
  display:flex; flex-direction:column; gap:12px;
}
.msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.msg.user {
  align-self: flex-end;
  background: #1db954;
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.bot {
  align-self: flex-start;
  background: #1e1e2e;
  color: #e0e0e0;
  border-bottom-left-radius: 4px;
}
.msg .sender {
  font-size: 11px; color: #888; margin-bottom: 4px;
}
.msg.bot .sender { color: #6c5ce7; }

/* 音乐卡片 */
.music-card {
  background: linear-gradient(135deg, #1e1e2e, #252540);
  border-radius: 12px; padding: 14px;
  border: 1px solid #2a2a3a;
  align-self: stretch;
}
.music-card .title { font-size: 13px; color: #6c5ce7; margin-bottom: 8px; }
.music-card .song { font-size: 14px; padding: 6px 0; border-bottom: 1px solid #2a2a3a; }
.music-card .song:last-child { border-bottom: none; }
.music-card .song-name { font-weight: 600; }
.music-card .song-artist { color: #888; font-size: 12px; }
.music-card .song-reason { color: #aaa; font-size: 12px; margin-top: 2px; }

/* 输入区 */
.input-area {
  padding: 12px 16px;
  background: #111118;
  border-top: 1px solid #2a2a3a;
  display: flex; gap: 10px;
  flex-shrink: 0;
}
.input-area input {
  flex:1; background: #1e1e2e; border: 1px solid #333;
  color: #e0e0e0; padding: 10px 16px; border-radius: 24px;
  font-size: 14px; outline: none;
}
.input-area input:focus { border-color: #6c5ce7; }
.input-area button {
  background: #6c5ce7; color: #fff; border: none;
  width: 42px; height: 42px; border-radius: 50%;
  font-size: 18px; cursor: pointer; flex-shrink: 0;
}

/* 弹窗 */
.modal {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.7); z-index:100;
  justify-content:center; align-items:center;
}
.modal.show { display:flex; }
.modal-content {
  background: #1e1e2e; border-radius: 16px; padding: 20px;
  width: 90%; max-width: 360px;
}
.modal-content h3 { font-size: 16px; margin-bottom: 14px; }
.modal-content input {
  width:100%; background: #111; border: 1px solid #333; color: #e0e0e0;
  padding: 10px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 10px;
}
.modal-content .btn-row { display:flex; gap:8px; justify-content:flex-end; }
.modal-content button {
  padding: 8px 16px; border-radius: 10px; border: none; font-size: 13px; cursor: pointer;
}
.btn-primary { background: #6c5ce7; color: #fff; }
.btn-ghost { background: #2a2a3a; color: #ccc; }

/* 角色列表 */
.char-list { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.char-tag {
  padding: 6px 12px; border-radius: 14px; font-size: 12px;
  background: #2a2a3a; color: #ccc; cursor: pointer; border: none;
}
.char-tag.selected { background: #6c5ce7; color: #fff; }

/* loading */
.loading {
  display:inline-block; width:8px; height:8px; border-radius:50%;
  background:#6c5ce7; animation:pulse 1s infinite;
}
@keyframes pulse { 0%,100% { opacity:0.2; } 50% { opacity:1; } }

/* 快捷指令 */
.quick-actions {
  display:flex; gap:8px; padding:0 16px 8px; flex-shrink:0; overflow-x:auto;
}
.quick-actions button {
  padding: 6px 14px; border-radius: 16px; border: 1px solid #333;
  background: transparent; color: #aaa; font-size: 12px;
  cursor: pointer; white-space: nowrap;
}
.quick-actions button:active { background: #2a2a3a; }
</style>
</head>
<body>

<div class="header">
  <div class="avatar" id="avatar">🎵</div>
  <div class="char-info">
    <div class="char-name" id="charName">加载中...</div>
    <div class="char-type" id="charType"></div>
  </div>
  <div class="header-btns">
    <button onclick="openSwitch()">切换角色</button>
    <button onclick="openNew()">+新建</button>
  </div>
</div>

<div class="chat-area" id="chatArea">
  <div class="msg bot">
    <div class="sender">系统</div>
    欢迎来到音乐 AI 伴侣 🎵<br>我是你的音乐伙伴 想听什么歌 聊什么都行
  </div>
</div>

<div class="quick-actions" id="quickActions">
  <button onclick="sendQuick('🎵 推荐几首歌')">🎵 推荐歌曲</button>
  <button onclick="sendQuick('今天天气怎么样')">🌤 天气</button>
  <button onclick="fetchMorning()">☀️ 早安消息</button>
  <button onclick="fetchMusic()">📋 今日歌单</button>
</div>

<div class="input-area">
  <input id="msgInput" placeholder="发消息..." autofocus onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">➤</button>
</div>

<!-- 切换角色弹窗 -->
<div class="modal" id="switchModal">
  <div class="modal-content">
    <h3>切换角色</h3>
    <div class="char-list" id="charList"></div>
    <input id="switchInput" placeholder="输入角色名（如：周杰伦）">
    <div class="btn-row">
      <button class="btn-ghost" onclick="closeSwitch()">取消</button>
      <button class="btn-primary" onclick="doSwitch()">切换</button>
    </div>
  </div>
</div>

<!-- 新建角色弹窗 -->
<div class="modal" id="newModal">
  <div class="modal-content">
    <h3>新建角色</h3>
    <input id="newName" placeholder="角色名（如：周杰伦）">
    <input id="newDesc" placeholder="一句话描述（可选）如：华语流行天王">
    <div class="btn-row">
      <button class="btn-ghost" onclick="closeNew()">取消</button>
      <button class="btn-primary" onclick="doNew()">创建</button>
    </div>
  </div>
</div>

<script>
let currentChar = null;

async function api(url, data) {
  try {
    const opts = data ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)} : {};
    const r = await fetch(url, opts);
    return await r.json();
  } catch(e) { return {error: '网络错误'}; }
}

async function refreshStatus() {
  const s = await api('/api/status');
  if (s.character) {
    currentChar = s.character;
    document.getElementById('charName').textContent = s.character.name;
    document.getElementById('charType').textContent = s.character.type || '';
    document.getElementById('avatar').textContent = s.character.name[0];
  }
}

function addMessage(role, text, sender) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  if (sender) {
    const senderNode = document.createElement('div');
    senderNode.className = 'sender';
    senderNode.textContent = sender;
    div.appendChild(senderNode);
  }
  div.appendChild(document.createTextNode(text));
  document.getElementById('chatArea').appendChild(div);
  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
}

function addMusicCard(songsText) {
  const div = document.createElement('div');
  div.className = 'music-card';
  const lines = songsText.split('\n').filter(l => l.trim());
  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = '🎵 今日歌单';
  div.appendChild(title);
  for (const line of lines) {
    if (line.startsWith('今日歌单')) continue;
    const songNode = document.createElement('div');
    songNode.className = 'song';
    const dash = line.indexOf(' - ');
    if (dash > 0) {
      const rest = line.substring(dash + 3);
      const sp = rest.indexOf('  ');
      const artist = sp > 0 ? rest.substring(0, sp) : rest;
      const reason = sp > 0 ? rest.substring(sp + 2) : '';
      const nameNode = document.createElement('div');
      nameNode.className = 'song-name';
      nameNode.textContent = line.substring(0, dash);
      songNode.appendChild(nameNode);
      const artistNode = document.createElement('div');
      artistNode.className = 'song-artist';
      artistNode.textContent = artist;
      songNode.appendChild(artistNode);
      if (reason) {
        const reasonNode = document.createElement('div');
        reasonNode.className = 'song-reason';
        reasonNode.textContent = reason;
        songNode.appendChild(reasonNode);
      }
    } else {
      songNode.textContent = line;
    }
    div.appendChild(songNode);
  }
  document.getElementById('chatArea').appendChild(div);
  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
}

async function send() {
  const inp = document.getElementById('msgInput');
  const msg = inp.value.trim();
  if (!msg) return;
  inp.value = '';
  inp.disabled = true;
  addMessage('user', msg);
  try {
    const r = await api('/api/chat', {message: msg});
    if (r.reply) addMessage('bot', r.reply, r.character);
  } catch(e) {
    addMessage('bot', '出错了 稍后再试', '系统');
  }
  inp.disabled = false;
  inp.focus();
}

function sendQuick(msg) {
  document.getElementById('msgInput').value = msg;
  send();
}

async function fetchMusic() {
  const r = await api('/api/music');
  if (r.songs) addMusicCard(r.songs);
}

async function fetchMorning() {
  const r = await api('/api/morning');
  if (r.message) addMessage('bot', r.message, '早安');
}

// 角色弹窗
async function openSwitch() {
  const modal = document.getElementById('switchModal');
  const list = document.getElementById('charList');
  const s = await api('/api/characters');
  list.innerHTML = '';
  for (const c of (s.characters || [])) {
    const btn = document.createElement('button');
    btn.className = 'char-tag' + (c === currentChar?.name ? ' selected' : '');
    btn.textContent = c;
    btn.onclick = () => {
      document.getElementById('switchInput').value = c;
    };
    list.appendChild(btn);
  }
  document.getElementById('switchInput').value = '';
  modal.classList.add('show');
}

function closeSwitch() { document.getElementById('switchModal').classList.remove('show'); }

async function doSwitch() {
  const name = document.getElementById('switchInput').value.trim();
  if (!name) return;
  const r = await api('/api/switch', {name});
  if (r.character) {
    currentChar = r.character;
    refreshStatus();
    addMessage('bot', `嗨 我是 ${r.character.name} 想听什么歌`, r.character.name);
  }
  closeSwitch();
}

function openNew() { document.getElementById('newModal').classList.add('show'); }
function closeNew() { document.getElementById('newModal').classList.remove('show'); }

async function doNew() {
  const name = document.getElementById('newName').value.trim();
  const desc = document.getElementById('newDesc').value.trim();
  if (!name) return;
  const r = await api('/api/new', {name, desc});
  if (r.character) {
    currentChar = r.character;
    refreshStatus();
    addMessage('bot', `角色已创建 我是 ${r.character.name} 来聊音乐吧`, r.character.name);
  }
  closeNew();
}

// 启动
refreshStatus();
</script>
</body>
</html>
